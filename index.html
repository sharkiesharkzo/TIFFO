<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiffo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .comic-container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .navigation {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="comic-container">
    <img id="comicImage" src="page1.jpg" alt="uh oh tiffo crashed">
    <div class="navigation">
        <button id="prevBtn">Previous</button>
        <span id="pageIndicator">Page 1 / 5</span>
        <button id="nextBtn">Next</button>
    </div>
</div>

<script>
    // Array of comic pages
    const pages = [
        'tiffo1.jpg',
        'tiffo2.jpg',
        'tiffo3.jpg',
        'tiffo4.jpg',
        'tiffo5.jpg',
        'tiffo6.jpg',
        'more.jpg'
    ];
    
    let currentPage = 0;

    const comicImage = document.getElementById('comicImage');
    const pageIndicator = document.getElementById('pageIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function updatePage() {
        comicImage.src = pages[currentPage];
        pageIndicator.textContent = `Page ${currentPage + 1} / ${pages.length}`;
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage === pages.length - 1;
    }

    prevBtn.addEventListener('click', () => {
        if (currentPage > 0) {
            currentPage--;
            updatePage();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentPage < pages.length - 1) {
            currentPage++;
            updatePage();
        }
    });

    updatePage(); // Initialize
</script>
</body>
</html>
